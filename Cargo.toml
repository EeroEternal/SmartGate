[package]
name = "smartgate"
version = "0.6.0"
edition = "2021"
authors = ["SmartGate Contributors"]
description = "Lightweight AI gateway control plane with intelligent Auto/Pro/Flash routing and xlite data plane"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database (SQLite)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# HTTP Client (xlite sync & streaming proxy)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dotenvy = "0.15"
async-trait = "0.1"
futures-util = "0.3"
dashmap = "6.0"
once_cell = "1.19"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
clap = { version = "4.0", features = ["derive", "env"] }
