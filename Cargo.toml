[package]
name = "smartgate"
version = "0.3.1"
edition = "2021"
authors = ["SmartGate Contributors"]
description = "Open-source AI gateway with control/data plane separation — cut spend with smart routing"

[dependencies]
# Core Engine
unigateway-sdk = { version = "2.14.0", features = ["host", "session"] }

# Web Framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dotenvy = "0.15"
async-trait = "0.1"
futures-util = "0.3"
dashmap = "6.0"
once_cell = "1.19"
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4.0", features = ["derive", "env"] }
eero_llm_providers = "0.14.6"
reqwest = { version = "0.12", features = ["json"] }
unigateway-session = { version = "2.14.0", features = ["http"] }
unigateway-session-redis = "2.14.0"
redis = "0.27.6"
